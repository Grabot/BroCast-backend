apiVersion: batch/v1
kind: CronJob
metadata:
  name: <cron_name>
  namespace: <namespace>
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: <kubernetes-node-name>
          volumes:
            - name: postgres-data
              persistentVolumeClaim:
                claimName: local-<project_name>-pvc
          containers:
            - name: cron-worker
              image: <docker_hub_name>/<cron_image_name>:<tag>
              volumeMounts:
                - mountPath: /src/static/uploads
                  name: postgres-data
              envFrom:
                - secretRef:
                    name: fastapi-secret
              env:
                - name: POSTGRES_URL
                  value: postgres-service.<namespace>.svc.cluster.local
                - name: POSTGRES_PORT
                  value: <postgres_port>
                - name: REDIS_URL
                  value: redis-service.<namespace>.svc.cluster.local
                - name: REDIS_PORT
                  value: <redis_port>
                - name: GITHUB_CLIENT_ID
                  value: <github_client_id>
                - name: GITHUB_CLIENT_SECRET
                  value: <github_client_secret>
                - name: REDDIT_CLIENT_ID
                  value: <reddit_client_id>
                - name: REDDIT_CLIENT_SECRET
                  value: <reddit_client_secret>
                - name: REDDIT_REDIRECT
                  value: <reddit_redirect>
                - name: JWT_ALG
                  value: <jwt_alg>
                - name: JWT_CRV
                  value: <jwt_crv>
                - name: JWT_D
                  value: <jwt_d>
                - name: JWT_KTY
                  value: <jwt_kty>
                - name: JWT_X
                  value: <jwt_x>
                - name: JWT_Y
                  value: <jwt_y>
                - name: JWT_USE
                  value: <jwt_use>
                - name: JWT_KID
                  value: <jwt_kid>
                - name: JWT_TYP
                  value: <jwt_typ>
                - name: JWT_SUB
                  value: <jwt_sub>
                - name: JWT_ISS
                  value: <jwt_iss>
                - name: JWT_AUD
                  value: <jwt_aud>
                - name: BASE_URL
                  value: <base_url>
                - name: DB_EXCLUDE_TABLES
                  value: "[]"
                - name: APPLE_AUTH_KEY
                  value: <apple_auth_key>
                - name: APPLE_CLIENT_ID
                  value: <apple_client_id>
                - name: APPLE_KEY_ID
                  value: <apple_key_id>
                - name: APPLE_TEAM_ID
                  value: <apple_team_id>
                - name: APPLE_GRANT_TYPE
                  value: <apple_grant_type>
                - name: APPLE_REDIRECT_URL
                  value: <apple_redirect_url>
                - name: LOG_READ_PASSWORD
                  value: <log_read_password>
                - name: FIREBASE_PROJECT_ID
                  value: "<firebase_project_id>"
                - name: FIREBASE_PRIVATE_KEY_ID
                  value: "<firebase_private_key_id>"
                - name: FIREBASE_PRIVATE_KEY
                  value: "<firebase_private_key>"
                - name: FIREBASE_CLIENT_EMAIL
                  value: "<firebase_client_email>"
                - name: FIREBASE_CLIENT_ID
                  value: "<firebase_client_id>"
                - name: FIREBASE_CLIENT_X509_CERT_URL
                  value: "<firebase_client_x509_cert_url>"
                - name: SMTP_PASSWORD
                  value: "<smtp_password>"
                - name: SMTP_ACCOUNT
                  value: "<smtp_account>"
                - name: SMTP_USER
                  value: "<smtp_user>"
                - name: SMTP_HOST
                  value: "<smtp_host>"
                - name: SMTP_PORT
                  value: "<smtp_port>"
                - name: S3_ENDPOINT
                  value: "<s3_endpoint>"
                - name: S3_ACCESS_KEY
                  value: "<s3_access_key>"
                - name: S3_SECRET_KEY
                  value: "<s3_secret_key>"
                - name: S3_BUCKET_NAME
                  value: "<s3_bucket_name>"
                - name: S3_SECURE
                  value: "<s3_secure>"
                - name: S3_ENCRYPTION_KEY
                  value: "<s3_encryption_key>"
                - name: PROJECT_NAME
                  value: "<project_name>"
              args:
                - python
                - main_cron.py
          restartPolicy: OnFailure
