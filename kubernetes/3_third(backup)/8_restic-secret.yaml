apiVersion: v1
kind: Secret
metadata:
  name: restic-credentials
  namespace: <namespace>
type: Opaque
stringData:
  RESTIC_REPOSITORY: sftp://<hetzner-storage-box-user>@<hetzner-storage-box-address-link>:23/backups/postgresql
  RESTIC_PASSWORD: <restic-password>
data:
  SSH_PRIVATE_KEY: <base-64-encoded-ssh-private-key>
  KNOWN_HOSTS: <base-64-encoded-known-hosts>