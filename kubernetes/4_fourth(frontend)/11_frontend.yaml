apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: <namespace>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: <kubernetes-node-name>
      containers:
        - name: frontend
          image: <docker_hub_username>/<frontend_project_repo>:<version>
          ports:
            - containerPort: <frontend_port>
          resources:
            requests:
              cpu: "1000m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
          env:
            - name: VITE_PUBLIC_BASE_URL
              value: <vite_public_base_urL>
            - name: VITE_PUBLIC_API_VERSION
              value: <vite_public_api_version>
            - name: VITE_GOOGLE_CLIENT_ID
              value: <vite_google_client_id>
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: <namespace>
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: <exposed_frontend_port>
      targetPort: <frontend_port>
