apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: <namespace>
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-api
  namespace: <namespace>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: <kubernetes-node-name>
      containers:
        - name: redis-api
          image: redis:latest
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "1000m"  # 1 CPU
              memory: "8Gi"  # 8 Gigabytes
            limits:
              cpu: "2000m"  # 2 CPU
              memory: "16Gi"  # 16 Gigabytes