apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: broer
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: db-migrate
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: grabot/bro_cast:1.115
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          envFrom:
            - secretRef:
                name: fastapi-secret
            - secretRef:
                name: brocast-app
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: password
          command: ["python"]
          args:
            - -c
            - |
              import asyncio, os, sys, time
              import asyncpg
              async def main():
                  conn = await asyncpg.connect(
                      host=os.environ["POSTGRES_URL"],
                      port=int(os.environ.get("POSTGRES_PORT", "5432")),
                      user=os.environ["POSTGRES_USER"],
                      password=os.environ["POSTGRES_PASSWORD"],
                      database=os.environ["POSTGRES_DB"],
                      timeout=5,
                  )
                  await conn.close()
              deadline = time.time() + 300
              while True:
                  try:
                      asyncio.run(main())
                      print("Postgres is reachable", flush=True)
                      break
                  except Exception as exc:
                      if time.time() >= deadline:
                          print(f"ERROR: DB not ready in 300s: {exc}", flush=True)
                          sys.exit(1)
                      time.sleep(5)
      containers:
        - name: migrate
          image: grabot/bro_cast:1.115
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          envFrom:
            - secretRef:
                name: fastapi-secret
            - secretRef:
                name: brocast-app
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: password
          command: ["alembic"]
          args: ["upgrade", "head"]
