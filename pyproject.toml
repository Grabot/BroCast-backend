[tool.black]
line-length = 100

[tool.isort]
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["app/migrations/env.py"]

[tool.poetry]
name = "BroCast"
version = "1.7.0"
description = "BroCast! The chat app where you can chat with your bros!"
authors = ["Zwaar Developers"]
license = "GPL-3.0 license"
readme = "README.md"
package-mode=false

[tool.poetry.dependencies]
python = "3.14.1"
fastapi = "0.162.0"
uvicorn = "0.54.0"
python-dotenv = "1.2.4"
psycopg2-binary = "2.9.13"
psycopg = { version = "^3.2", extras = ["binary"] }
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
sqlmodel = "0.0.48"
alembic = "1.20.1"
asyncpg = "0.32.0"
passlib = "1.7.4"
authlib = "1.9.1"
oauthlib = "4.0.0"
python-socketio = "5.17.0"
websockets = "17.3"
asyncio-redis = "0.16.0"
redis = "8.1.0"
pillow = "13.0.0"
fastapi-pagination = "0.16.1"
fastapi-mail = "1.6.8"
celery = "5.6.3"
APScheduler = "3.11.3"
pydantic_settings = "2.16.1"
requests = "2.34.2"
PyJWT = "2.15.1"
python-multipart = "0.0.32"
pytz = "2026.5"
firebase-admin = "7.7.0"
firebase-functions = "0.6.0"
numpy = "2.5.4"
opencv-python-headless = "5.0.0.93"
boto3 = "1.43.118"
botocore = "1.43.118"
grpcio = "1.84.1"
PyYAML = "6.0.3"
markupsafe = "3.0.4"

[tool.poetry.group.dev.dependencies]
podman-compose = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
